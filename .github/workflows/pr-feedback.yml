name: PR — changes requested

# A human requested changes on an agent's pull request: put the agent back on
# it. The implement workflow relabels the issue `agent:in-progress` itself.
#
# Reviews from bots are ignored on purpose. The impact review and the inline
# code review both comment on these PRs, and letting a bot's review restart the
# implementation would close a loop with nobody in it.

on:
  pull_request_review:
    types: [submitted]

# A reusable workflow cannot grant itself more than its caller has, so these
# are what agent-implement.yml needs, not what this workflow uses directly.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  route:
    if: >-
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.type != 'Bot' &&
      startsWith(github.event.pull_request.head.ref, 'claude/issue-')
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.issue.outputs.number }}
    steps:
      - name: Read the issue number off the branch
        id: issue
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # claude/issue-42 or claude/issue-42-20260917-1830 — an @claude run
          # names its branch with a timestamp suffix.
          if [[ "$BRANCH" =~ ^claude/issue-([0-9]+)(-.*)?$ ]]; then
            number="${BASH_REMATCH[1]}"
          else
            echo "::error::Cannot read an issue number from '$BRANCH'"; exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Changes requested on #$number by ${{ github.event.review.user.login }}."

  revise:
    needs: route
    uses: ./.github/workflows/agent-implement.yml
    with:
      issue: ${{ needs.route.outputs.issue }}
      mode: revise
    secrets: inherit
