name: Agent — implement

# Does the work for one issue: branch, draft PR, implementation, verification,
# then hands the PR over for review. Called by project-sync.yml when a card
# reaches "Ready", and by pr-feedback.yml when a human requests changes.
# Also runnable by hand from the Actions tab.

on:
  workflow_call:
    inputs:
      issue:
        description: Issue number to work on.
        type: string
        required: true
      mode:
        description: implement (first pass) or revise (address review feedback).
        type: string
        default: implement
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to work on.
        type: string
        required: true
      mode:
        description: implement (first pass) or revise (address review feedback).
        type: choice
        options: [implement, revise]
        default: implement

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

# One agent per issue. Not cancel-in-progress: a half-finished run that is
# killed mid-push leaves the branch in a worse state than a queued one.
concurrency:
  group: agent-issue-${{ inputs.issue }}
  cancel-in-progress: false

env:
  PROJECT_TITLE: ${{ vars.PROJECT_TITLE || 'Devopstui Kanban' }}
  PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The board token is a PAT with project scope and is deliberately kept
      # out of every step that runs model output. See docs/automation.md.
      - name: Create or reuse the branch and draft PR
        id: prep
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          MODE: ${{ inputs.mode }}
        run: .github/scripts/start-work.sh

      - name: Move the issue to In progress
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/project.sh set-status "${{ inputs.issue }}" "In progress"
          # The scan usually claims the issue with this label already; a manual
          # or pr-feedback run has to claim it here instead, and the label has
          # to exist for that to work.
          gh label create "claude:implementing" --color 5319e7 \
            --description "An agent is working on this right now" --force >/dev/null 2>&1 || true
          gh issue edit "${{ inputs.issue }}" --add-label "claude:implementing" >/dev/null
          gh issue edit "${{ inputs.issue }}" --remove-label "claude:blocked" >/dev/null 2>&1 || true

      - name: Set up Go, tmux and build
        uses: ./.github/actions/go-tui-env

      - name: Implement
        uses: anthropics/claude-code-action@v1
        env:
          # The workflow's own token, not the PAT: this step runs model output,
          # and the job's permissions block is the blast radius.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            You are working on ${{ github.repository }} issue #${{ inputs.issue }}.

            Branch `${{ steps.prep.outputs.branch }}` is checked out and pull
            request #${{ steps.prep.outputs.pr }} is open as a draft against
            `${{ steps.prep.outputs.base }}`. The board says "In progress".

            Follow the playbook in
            `.github/claude/prompts/${{ inputs.mode == 'revise' && 'revise' || 'implement' }}.md`
            exactly, and read `.github/claude/CONTEXT.md` before you start.

            Commit your work and push it to `${{ steps.prep.outputs.branch }}`.
            Do not mark the pull request ready for review and do not change the
            board — the workflow does both once this run finishes.
          claude_args: |
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebFetch"
            --max-turns 80

      - name: Push anything the agent left behind
        run: |
          set -euo pipefail
          branch="${{ steps.prep.outputs.branch }}"
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The agent left uncommitted changes on $branch:"
            git status --short
            exit 1
          fi
          git fetch origin "$branch"
          if [ -n "$(git log --oneline "origin/$branch..HEAD")" ]; then
            echo "Pushing commits the agent did not push:"
            git log --oneline "origin/$branch..HEAD"
            git push origin "HEAD:$branch"
          fi

      # The board only advances on a branch that actually builds. This runs
      # independently of whatever the agent reported.
      - name: Verify the branch
        run: make check

      - name: Capture the UI
        if: always()
        continue-on-error: true
        run: make shots

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-issue-${{ inputs.issue }}-${{ github.run_attempt }}
          path: .shots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Mark the PR ready and move the issue to In review
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail
          # Marking it ready with the PAT rather than the workflow token is what
          # fires ready_for_review, which is what starts CI and the review
          # agents. Already-ready is not an error worth failing the run over.
          gh pr ready "${{ steps.prep.outputs.pr }}" || true
          .github/scripts/project.sh set-status "${{ inputs.issue }}" "In review"
          gh issue edit "${{ inputs.issue }}" \
            --remove-label "claude:implementing" --add-label "claude:in-review" 2>/dev/null || true

      - name: Report a run that did not finish
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue edit "${{ inputs.issue }}" \
            --add-label "claude:blocked" --remove-label "claude:implementing" 2>/dev/null || true
          printf '%s\n' \
            "The **${{ inputs.mode }}** run for this issue did not finish: [run log]($RUN_URL)." \
            "" \
            "The issue stays at \`In progress\` and is labelled \`claude:blocked\`. Nothing was" \
            "marked ready for review. To retry, move the card out of and back into \`Ready\`," \
            "or run the *Agent — implement* workflow by hand with this issue number." \
            > /tmp/blocked.md
          gh issue comment "${{ inputs.issue }}" --body-file /tmp/blocked.md
