name: Project sync

# The bridge between the board and the workflows.
#
# GitHub will not start a repository workflow when a project card moves:
# projects_v2_item webhooks exist only at organisation level and are not an
# Actions trigger. So the board is polled instead, and this workflow reconciles
# it: cards at "Ready" get an agent, cards at "In review" whose latest commit
# has not been reviewed get a reviewer, and closed issues are moved to "Done".
#
# Everything here is idempotent — a card that is already being worked on is
# skipped — so an extra run costs nothing but the poll.
#
# Note: scheduled workflows only run from the default branch, and GitHub
# disables them after 60 days without repository activity. `Run workflow` on
# the Actions tab starts a poll immediately if you do not want to wait.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# A reusable workflow cannot grant itself more than its caller has, so these
# are the permissions agent-implement.yml and agent-review.yml need.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # Grouped on the scan alone, not the whole workflow: the implement jobs
    # below can run for half an hour, and blocking every poll behind them would
    # stall reviews and every other card on the board.
    concurrency:
      group: project-sync-scan
      cancel-in-progress: false
    outputs:
      implement: ${{ steps.scan.outputs.implement }}
      review: ${{ steps.scan.outputs.review }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan the board
        id: scan
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_TITLE: ${{ vars.PROJECT_TITLE || 'Devopstui Kanban' }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          MAX_IMPLEMENT: ${{ vars.MAX_IMPLEMENT || '2' }}
          MAX_REVIEW: ${{ vars.MAX_REVIEW || '3' }}
        run: .github/scripts/scan.sh

  implement:
    needs: scan
    if: needs.scan.outputs.implement != '[]' && needs.scan.outputs.implement != ''
    strategy:
      # One at a time: several agents pushing branches and rewriting the board
      # at once is harder to follow and no faster in practice.
      max-parallel: 1
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.scan.outputs.implement) }}
    uses: ./.github/workflows/agent-implement.yml
    with:
      issue: ${{ matrix.issue }}
      mode: implement
    secrets: inherit

  review:
    needs: scan
    if: needs.scan.outputs.review != '[]' && needs.scan.outputs.review != ''
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.scan.outputs.review) }}
    uses: ./.github/workflows/agent-review.yml
    with:
      pr: ${{ matrix.pr }}
    secrets: inherit
