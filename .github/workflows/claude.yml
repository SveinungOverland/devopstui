name: Claude Code

# The manual escape hatch: mention @claude in an issue or a PR comment to ask
# for something outside the board pipeline. Everything automatic lives in
# issue-plan.yml, project-sync.yml, agent-implement.yml and agent-review.yml —
# see docs/automation.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      # Write, so that asking Claude for a change in a comment can actually
      # produce one. The action still only answers people with write access.
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The same Go toolchain, tmux and prebuilt binary the automated agents
      # get, so an ad-hoc request can build, test and screenshot too.
      - name: Set up Go, tmux and build
        uses: ./.github/actions/go-tui-env

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          claude_args: |
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep,WebFetch"
            --append-system-prompt "Read .github/claude/CONTEXT.md before doing anything in this repository: it covers the package layout, how to verify a change with `make check`, and how to capture what the TUI looks like with scripts/tui-shot.sh. Show the UI in a fenced code block whenever a change is visible. Do not move cards on the project board — the workflows own that."
